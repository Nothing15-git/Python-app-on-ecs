name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install, lint, test
        working-directory: app
        run: |
          pip install -r requirements-dev.txt
          flake8 app.py test_app.py --max-line-length=100
          pytest -q

      - name: Build image (tagged with commit SHA)
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
